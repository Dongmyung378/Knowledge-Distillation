[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-seg-kd"
version = "4.0.0"
description = "Cross-Architecture Knowledge Distillation for Autonomous Driving Semantic Segmentation (SegFormer-B5 -> MobileNetV4 ONNX INT8)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
    "transformers>=4.44",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
seg-kd = "seg_kd.__main__:main"

[tool.setuptools.packages.find]
include = ["seg_kd*"]
