<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc" lang="en">
<style>text{font-family:'DejaVu Sans',Arial,sans-serif!important}</style><title id="title">Representative student error repairs and pure-distillation controls</title>
<desc id="desc">Representative T5-a05 repairs 473 teacher errors and loses 267 teacher-correct predictions, a net gain of 206. Pure distillation also exceeds the teacher; causal contributions remain unconfirmed.</desc>
<style>text{font-family:'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;font-variant-numeric:tabular-nums} .axis{fill:#64696B}</style>
<rect x="0" y="0" width="1200" height="1050" fill="#F6F3F6" rx="0" stroke-width="1" />
<text x="48" y="64" fill="#382D3D" font-size="36" font-weight="750" text-anchor="start">Representative student errors and training objectives</text>
<text x="48" y="104" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">Same 5,850 reference images for T5-a05. Repairs and new errors are counted together.</text>
<rect x="48" y="152" width="352" height="197" fill="#FFFFFF" rx="20" stroke="#DDDDE0" stroke-width="1" />
<text x="72" y="197" fill="#382D3D" font-size="27" font-weight="700" text-anchor="start">Teacher errors repaired</text>
<text x="72" y="285" fill="#526D35" font-size="65" font-weight="750" text-anchor="start">473</text>
<text x="364" y="285" fill="#64696B" font-size="25" font-weight="400" text-anchor="end">cases</text>
<rect x="424" y="152" width="352" height="197" fill="#FFFFFF" rx="20" stroke="#DDDDE0" stroke-width="1" />
<text x="448" y="197" fill="#382D3D" font-size="27" font-weight="700" text-anchor="start">Teacher correct lost</text>
<text x="448" y="285" fill="#A15C49" font-size="65" font-weight="750" text-anchor="start">267</text>
<text x="740" y="285" fill="#64696B" font-size="25" font-weight="400" text-anchor="end">cases</text>
<rect x="800" y="152" width="352" height="197" fill="#FFFFFF" rx="20" stroke="#DDDDE0" stroke-width="1" />
<text x="824" y="197" fill="#382D3D" font-size="27" font-weight="700" text-anchor="start">Net correct gain</text>
<text x="824" y="285" fill="#74506E" font-size="65" font-weight="750" text-anchor="start">+206</text>
<text x="1116" y="285" fill="#64696B" font-size="25" font-weight="400" text-anchor="end">cases</text>
<text x="48" y="408" fill="#526D35" font-size="32" font-weight="750" text-anchor="start">Accuracy difference: +3.52 pp</text>
<line x1="48" y1="441" x2="1152" y2="441" stroke="#DDDDE0" stroke-width="2" />
<text x="48" y="494" fill="#382D3D" font-size="31" font-weight="750" text-anchor="start">Training objectives for the same student architecture</text>
<text x="48" y="535" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">Mean and sample SD over 3 runs per objective. Teacher accuracy 83.54% comes from one fixed model.</text>
<line x1="380.0" y1="567" x2="380.0" y2="811" stroke="#DDDDE0" stroke-width="1" />
<text x="380.0" y="844" fill="#64696B" font-size="21" font-weight="400" text-anchor="middle">0</text>
<line x1="496.6" y1="567" x2="496.6" y2="811" stroke="#DDDDE0" stroke-width="1" />
<text x="496.6" y="844" fill="#64696B" font-size="21" font-weight="400" text-anchor="middle">20</text>
<line x1="613.2" y1="567" x2="613.2" y2="811" stroke="#DDDDE0" stroke-width="1" />
<text x="613.2" y="844" fill="#64696B" font-size="21" font-weight="400" text-anchor="middle">40</text>
<line x1="729.8" y1="567" x2="729.8" y2="811" stroke="#DDDDE0" stroke-width="1" />
<text x="729.8" y="844" fill="#64696B" font-size="21" font-weight="400" text-anchor="middle">60</text>
<line x1="846.4000000000001" y1="567" x2="846.4000000000001" y2="811" stroke="#DDDDE0" stroke-width="1" />
<text x="846.4000000000001" y="844" fill="#64696B" font-size="21" font-weight="400" text-anchor="middle">80</text>
<line x1="963.0" y1="567" x2="963.0" y2="811" stroke="#DDDDE0" stroke-width="1" />
<text x="963.0" y="844" fill="#64696B" font-size="21" font-weight="400" text-anchor="middle">100</text>
<text x="48" y="606" fill="#382D3D" font-size="25" font-weight="700" text-anchor="start">Hard labels only</text>
<rect x="380" y="579" width="455.2050712250712" height="40" fill="#AAA1A8" rx="7" stroke-width="1" />
<text x="990" y="607" fill="#382D3D" font-size="28" font-weight="750" text-anchor="start">78.08%</text>
<text x="990" y="638" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">± 3.94%p</text>
<text x="48" y="683" fill="#382D3D" font-size="25" font-weight="700" text-anchor="start">Pure distillation</text>
<rect x="380" y="656" width="510.5153276353277" height="40" fill="#BF9556" rx="7" stroke-width="1" />
<text x="990" y="684" fill="#382D3D" font-size="28" font-weight="750" text-anchor="start">87.57%</text>
<text x="990" y="715" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">± 2.32%p</text>
<text x="48" y="760" fill="#382D3D" font-size="25" font-weight="700" text-anchor="start">Representative mixed KD</text>
<rect x="380" y="733" width="510.183133903134" height="40" fill="#526D35" rx="7" stroke-width="1" />
<text x="990" y="761" fill="#382D3D" font-size="28" font-weight="750" text-anchor="start">87.51%</text>
<text x="990" y="792" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">± 2.18%p</text>
<text x="1138" y="850" fill="#64696B" font-size="21" font-weight="400" text-anchor="end">Accuracy (%)</text>
<text x="48" y="889" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">Pure distillation exceeds the teacher in all 3 runs; adding hard-label loss alone cannot explain this.</text>
<text x="48" y="923" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">Possible explanations: partial teacher tuning with frozen BN, full student training with updated BN, and optimization.</text>
<text x="48" y="1019" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">Causal contributions are unconfirmed. This does not show that compression raises accuracy or students always beat teachers.</text>
