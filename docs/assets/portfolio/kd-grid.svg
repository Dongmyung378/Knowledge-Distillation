<text x="48" y="829" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">T는 증류 온도이고 α는 정답 손실의 비중입니다. 조건 선택에는 참조 평가 결과를 사용하지 않았습니다.</text>
<text x="48" y="861" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">대표 배포 유지 결정은 이미 관측된 결과와 공개 모델의 연속성을 고려한 후속 결정입니다.</text>
<text x="48" y="919" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">참조 평가: 같은 이미지 5,850장. 반복 개발 시드의 비교이며 독립적인 최종 확인 실험은 아닙니다.</text>
