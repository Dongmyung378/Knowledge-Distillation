<text x="48" y="104" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">각 칸은 시드 378, 379, 380의 평균입니다. 아래의 ± 값은 표본 표준편차이며 신뢰구간이 아닙니다.</text>
