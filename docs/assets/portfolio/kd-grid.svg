<title id="title">전체 9개 조건의 검증 및 참조 평가 반복 실험</title>
<desc id="desc">온도 3, 5, 10과 정답 손실 비중 0.1, 0.3, 0.5를 각각 3개 시드로 학습했습니다. 검증 평균으로 T5-a01을 선택했으며 대표 배포는 기존 T5-a05를 유지합니다. 평균과 표본 표준편차는 독립 확인 신뢰구간이 아닙니다.</desc>
