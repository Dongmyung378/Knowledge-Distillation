<text x="48" y="889" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">순수 증류도 3회 모두 교사를 넘었습니다. 정답 손실을 추가한 것만으로 현상을 설명할 수 없습니다.</text>
<text x="48" y="923" fill="#64696B" font-size="21" font-weight="400" text-anchor="start">교사의 부분 미세 조정과 고정 BN, 학생 전체 학습과 BN 갱신, 최적화 경로 차이는 설명 후보입니다.</text>
