<title id="title">대표 학생의 교사 오류 수정과 순수 증류 대조</title>
<desc id="desc">대표 T5-a05 학생은 교사 오답 473개를 수정하고 교사 정답 267개를 놓쳐 정답이 206개 늘었습니다. 순수 증류 대조도 교사를 넘었지만 각 원인의 인과 기여는 확정하지 않았습니다.</desc>
