name: CPU Unit & Pipeline Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install numpy pillow matplotlib timm transformers onnx onnxruntime
      - name: Run unit & end-to-end smoke tests
        run: python -m unittest discover -s tests -v
